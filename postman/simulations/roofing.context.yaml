purpose:
  stands_in_for: Whop sandbox HTTP endpoints for leads, payments, receipt reads, and draft/send/issue invoices.
  unblocks: Local verification of the actual route handlers without credentials or financial side effects.
assumptions:
  - id: current-request-shapes
    status: supported
    claim: The implemented request field names and invoice currency units match the saved 2026-11-12 Whop contract for the exercised operations.
    reason: The provider OpenAPI was fetched directly and its relevant paths and references are saved in the repository.
    verification: On 2026-11-13 npm test passed 15 checks. The real handlers made HTTP calls through the Postman simulation; assertions inspected service plan selection, metadata, dollar invoice amounts, separate idempotency keys, and send or issue ordering.
    source: docs/whop-api-contract.json; tests/routes.test.ts; postman/mocks/whop/default.js
    updated_at: "2026-11-13"
  - id: provider-error-handling
    status: supported
    claim: In the exercised simulation scenarios, upstream HTML errors and rate limits become safe application errors, and a failed invoice draft prevents the send operation.
    reason: Assertions check the route response and number of actual HTTP requests captured by the stand-in.
    verification: npm test passed HTML, rate-limit, failed-draft, invalid-origin, invalid-body, and authorization cases on 2026-11-13. This establishes caller behavior against these stand-ins only.
    source: tests/routes.test.ts; scripts/test.mjs
    updated_at: "2026-11-13"
  - id: actual-whop-account-behavior
    status: unknown
    claim: Sandbox credentials and plans enable anonymous lead creation, eligible payment saving, and invoice collection for this contractor account.
    reason: Initial verification had no Whop credentials. Subsequently the sandbox plans and a paid inspection were read successfully; an authorized paid replacement deposit was not found. Setup completion, lead creation and invoice collection remain unverified in the real account. The owner mock search was skipped because Postman was signed out; direct official documentation supplied the contract.
    verification: Not exercised against Whop. Check all account-specific behaviors using docs/SETUP.md before submission.
    source: docs/SETUP.md; docs/SUBMISSION.md
    updated_at: "2026-11-13"
  - id: explicit-deposit-setup
    status: supported
    claim: In the exercised simulation, paid replacement deposits create and verify an existing-method setup intent; pending or mismatched setups cannot produce a saved-card confirmation, and setup retries create no new payment.
    reason: Server routes validate signed proofs and read the receipt and setup through real HTTP calls to the local stand-in. Client orchestration has separate redirect and retry checks.
    verification: The update passed 27 total checks with 115 simulation request entries including controls. Invalid proofs also returned 403 through the running Worker. No live replacement setup was created; sandbox read-only inspection found only a paid inspection, so actual bank/setup completion remains unverified.
    source: lib/deposit-setup.ts; lib/deposit-client.ts; tests/routes.test.ts; tests/deposit-client.test.ts; docs/SETUP-INTENTS.md
    updated_at: "2026-11-13"
  - id: company-key-lead-requires-user
    status: supported
    claim: The sandbox company-key lead endpoint requires user_id; the lead route must resolve a real account member before creating a lead.
    reason: A real sandbox metadata-only lead request returned HTTP 400 with user_id is required. The documented member-create endpoint resolves an email to a user; the key currently lacks its member:manage scope, confirmed by HTTP 403.
    verification: The route and stand-in were corrected. 31 total checks passed with 138 HTTP simulation log entries including controls. No real diagnostic member or lead was created; live success remains pending the member:manage grant.
    source: app/api/leads/route.ts; tests/routes.test.ts; docs/whop-api-contract.json; docs/SETUP.md
    updated_at: "2026-11-13"
  - id: failed-receipt-is-not-pending
    status: supported
    claim: A payment receipt may remain open while its collection substatus is failed; the application must distinguish a confirmed billing failure from a pending outcome.
    reason: A real sandbox replacement receipt returned open/failed and a state/ZIP mismatch. The previous generic unsettled message obscured the correction required.
    verification: The verification endpoint now returns a sanitized billing error and retry eligibility for that receipt. 37 checks passed, including preserving recovery for pending or paid outcomes and clearing it only for confirmed failure. No new payment was created during diagnosis.
    source: lib/payment-state.ts; lib/deposit-client.ts; components/WhopPaymentForm.tsx; tests/payment-state.test.ts; tests/deposit-client.test.ts
    updated_at: "2026-11-13"
  - id: confirmed-checkout-recovery
    status: supported
    claim: The actual sandbox has a paid replacement deposit and linked succeeded setup, and the read-only confirmation endpoint validates both without creating another payment.
    reason: The sandbox records were read with the configured credential and the combined verifier checked their ownership and linkage. The browser rendered confirmation after refresh and returned to a populated homepage.
    verification: 39 server/client checks passed with 163 HTTP simulation entries including controls. Two React UI tests passed for stable exclusive SDK slots through success and containment of a widget render failure. No new payment was created during diagnosis or recovery.
    source: app/api/verify/route.ts; app/checkout/complete/page.tsx; components/WhopPaymentForm.tsx; components/WhopCheckoutModal.tsx; tests/checkout-ui.test.tsx
    updated_at: "2026-11-13"
  - id: activity-source-selection
    status: supported
    claim: Website-action filtering and payment receipt activity use different Whop resources and configured credentials.
    reason: The live production event list contained all three custom names, and a filtered request returned those records without dashboard noise. Sandbox transaction activity reads payment receipts rather than relying on production pixel purchase attribution.
    verification: Local route tests assert upstream custom-name filters, all-event selection, sandbox payment credentials, time bounds, and removal of private customer/payment-method fields. UI tests verify the selector changes requests and explains the source distinction. Browser verification of the deployed update is recorded in docs/VERIFICATION.md.
    source: lib/admin-data.ts; components/ContractorAdmin.tsx; tests/routes.test.ts; tests/admin-ui.test.tsx; https://docs.whop.com/developer/websites/tracking.md; docs/whop-api-contract.json
    updated_at: "2026-11-14"
  - id: optional-estimate-confirmation-email
    status: supported
    claim: In exercised stand-in scenarios, estimate confirmation email runs only after Whop persistence, and email failure does not turn a saved estimate into a failed submission.
    reason: Resend HTTP calls and route responses were asserted through a separate local simulation member. A repeat for the same saved note used the same provider idempotency key.
    verification: Route tests cover missing credentials, accepted payload, escaped HTML, rejected and unreadable responses, no-send on Whop failure, and key reuse. UI tests distinguish delivery acceptance from a saved estimate whose email failed. No actual delivery is claimed before credentials are configured.
    source: lib/estimate-email.ts; app/api/leads/route.ts; tests/routes.test.ts; tests/estimate-ui.test.tsx; https://resend.com/docs/api-reference/emails/send-email; https://resend.com/docs/dashboard/emails/idempotency-keys
    updated_at: "2026-11-14"
  - id: native-leads-test-mode
    status: supported
    claim: Native Leads test mode never silently falls back to Members estimate capture after a provider rejection.
    reason: The new real sandbox application request again returned HTTP 410. Local tests inspect the exact calls and confirm no notes/metadata capture or email follows that failure.
    verification: Native success and invalid-identity branches are stand-in scenarios only; the actual provider remains retired. Mode switching restores Members capture without deleting data. Production test mode and invalid values fail before writes; native listing reads Lead records and labels its source.
    source: app/api/leads/route.ts; lib/estimate-capture.ts; lib/admin-data.ts; tests/routes.test.ts; tests/admin-ui.test.tsx; docs/LEADS-MIGRATION.md
    updated_at: "2026-11-14"
  - id: event-price-semantics
    status: supported
    claim: New service and deposit-start actions send Whop's value/currency fields while the dashboard treats those prices separately from payment revenue.
    reason: The official pixel reference specifies value and currency; the previous price/amount fields did not populate native monetary fields. Historical nulls are preserved rather than fabricated.
    verification: UI action tests assert USD major-unit prices for inspection, repair and deposit and no purchase event. Dashboard tests verify loaded-row counts and missing-value labels. Live browser verified counts and navigation; the automated click's monetary value was not yet observed in the provider feed.
    source: components/RoofingSite.tsx; components/ContractorAdmin.tsx; tests/pricing-ui.test.tsx; tests/admin-ui.test.tsx; https://docs.whop.com/developer/websites/tracking.md
    updated_at: "2026-11-14"
fingerprints:
